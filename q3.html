<!DOCTYPE html>
<html>
    <body>



        

        <input type = "number" id = "num1" value = "0">
        <input type = "number" id = "num2" value = "0">
        <input type = "number" id = "num3" value = "0">
        <input type = "number" id = "num4" value = "0">
        <button onclick= "addNumbers()">Add Numbers</button>
        <p id = "result">Answer here!</p>
        <script>
            function addNumbers() {
                let number1 = parseFloat(document.getElementById("num1").value);
                let number2 = parseFloat(document.getElementById("num2").value);
                let number3 = parseFloat(document.getElementById("num3").value);
                let number4 = parseFloat(document.getElementById("num4").value);
                
                let sum = number1 + number2 + number3 + number4;
                choose= document.getElementById("result");
                choose.innerHTML = "The total mark is: " + sum;
                if(sum<"4"){
                    let grade="U";
                }
                if("3">sum<"13"){
                    let grade="G";
                }
                

                choose.innerHTML = "The total mark is: " + sum +  "<br>The grade is:"+ grade;
                

            }
        </script>

    </body>
</html>
